name: Torre Cruz - Lorie Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lorie:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar SDK, licencas, NDK e CMake
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager executavel nao encontrado em $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Compilar Lorie
        run: |
          chmod +x ./gradlew
          ./gradlew :lorie-app:assembleSharedUidDebug --no-daemon --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: torre-cruz-lorie-sharedUid-debug
          path: lorie-app/build/outputs/apk/**/*.apk
          if-no-files-found: error
